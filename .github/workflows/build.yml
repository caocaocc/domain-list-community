name: Build dlc.dat
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          repository: v2fly/domain-list-community
          path: code

      - name: Add domain list
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          SOURCES = {
              "reject-drop": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/reject-drop.json",
              ],
              "reject-no-drop": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/reject-no-drop.json",
              ],
              "reject": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/domainset/reject.json",
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/reject.json",
              ],
              "sogouinput": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/sogouinput.json",
              ],
              "speedtest": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/domainset/speedtest.json",
              ],
              "cdn": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/domainset/cdn.json",
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/cdn.json",
              ],
              "stream-hk": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_hk.json",
              ],
              "stream-tw": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_tw.json",
              ],
              "stream-jp": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_jp.json",
              ],
              "stream-kr": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_kr.json",
              ],
              "stream-eu": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_eu.json",
              ],
              "stream-us": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream_us.json",
              ],
              "stream": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/stream.json",
              ],
              "ai": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/ai.json",
              ],
              "download": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/domainset/download.json",
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/download.json",
              ],
              "global": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/global.json",
              ],
              "china": [
                  "https://raw.githubusercontent.com/caocaocc/ruleset/release/sing-box/non_ip/domestic.json",
              ],
          }
          DOMAIN_RE = re.compile(r"^[a-z0-9.-]+$")

          def fetch_json(url: str) -> dict:
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          def normalize_domain(value: str, strip_dot: bool):
              value = value.strip().lower()
              if strip_dot:
                  value = value.lstrip(".").rstrip(".")
              if not value:
                  return None
              if not DOMAIN_RE.match(value):
                  return None
              return value

          def build_lines(urls):
              lines = set()
              for url in urls:
                  payload = fetch_json(url)
                  for rule in payload.get("rules", []):
                      for item in rule.get("domain_suffix", []):
                          value = normalize_domain(item, strip_dot=True)
                          if value:
                              lines.add("domain:" + value)
                      for item in rule.get("domain", []):
                          value = normalize_domain(item, strip_dot=True)
                          if value:
                              lines.add("full:" + value)
                      for item in rule.get("domain_keyword", []):
                          value = normalize_domain(item, strip_dot=False)
                          if value:
                              lines.add("keyword:" + value)
                      for item in rule.get("domain_regex", []):
                          value = str(item).strip()
                          if value:
                              lines.add("regexp:" + value)
              return lines

          for name, urls in SOURCES.items():
              lines = build_lines(urls)
              header = ["# Generated from:"]
              header.extend("# - " + url for url in urls)
              header.append("")
              output_path = f"code/data/{name}"
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(header + sorted(lines)))
                  f.write("\n")
          PY

      - name: Append attribute rules
        run: |
          sed -i 's/^bilibili\.com$/bilibili.com @!cn/' ./code/data/bilibili
          sed -i '/^byte-test\.com$/d' ./code/data/bytedance
          sed -i '/^byte-test\.net$/d' ./code/data/bytedance
          sed -i '/^byte-test\.cn$/d' ./code/data/bytedance
          echo "domain:missav.live" >> ./code/data/missav
          echo "domain:hanimeone.me" >> ./code/data/category-porn
          echo "domain:hanime1.com" >> ./code/data/category-porn
          echo "domain:hanime1.me" >> ./code/data/category-porn
          echo "domain:javchu.com" >> ./code/data/category-porn
          echo "domain:ip.sb" >> ./code/data/category-ip-geo-detect
          echo "domain:ping0.cc" >> ./code/data/category-ip-geo-detect
          echo "domain:ipinfo.cv" >> ./code/data/category-ip-geo-detect
          echo "domain:ip125.com" >> ./code/data/category-ip-geo-detect
          echo "domain:ipip0.net" >> ./code/data/category-ip-geo-detect
          echo "domain:ip.skk.moe" >> ./code/data/category-ip-geo-detect
          echo "domain:phantom.com" >> ./code/data/category-cryptocurrency
          echo "domain:google.com" >> ./code/data/category-ai-!cn
          echo "domain:suno.com" >> ./code/data/category-ai-!cn
          echo "domain:minimax.io" >> ./code/data/category-ai-!cn
          echo "include:ai" >> ./code/data/category-ai-!cn
          echo "include:cdn" >> ./code/data/category-cdn
          echo "include:stream" >> ./code/data/category-entertainment
          echo "include:china" >> ./code/data/cn
          echo "full:stun.cloudflare.com" >> ./code/data/category-ntp
          echo "full:stun.l.google.com" >> ./code/data/category-ntp
          echo "full:stun1.l.google.com" >> ./code/data/category-ntp
          echo "full:stun2.l.google.com" >> ./code/data/category-ntp
          echo "full:stun3.l.google.com" >> ./code/data/category-ntp
          echo "full:stun4.l.google.com" >> ./code/data/category-ntp
          echo "full:global.stun.twilio.com" >> ./code/data/category-ntp
          echo "full:stun.sipgate.net" >> ./code/data/category-ntp
          echo "full:stun.3cx.com" >> ./code/data/category-ntp
          echo "full:stun2.3cx.com" >> ./code/data/category-ntp
          echo "full:stun.sonetel.com" >> ./code/data/category-ntp
          echo "full:stun.sonetel.net" >> ./code/data/category-ntp
          echo "full:stunserver2025.stunprotocol.org" >> ./code/data/category-ntp
          echo "full:stun.aa.net.uk" >> ./code/data/category-ntp
          echo "full:stun.acrobits.cz" >> ./code/data/category-ntp
          echo "full:stun.antisip.com" >> ./code/data/category-ntp
          echo "full:stun.ekiga.net" >> ./code/data/category-ntp
          echo "full:stun.freeswitch.org" >> ./code/data/category-ntp
          echo "full:stun.pjsip.org" >> ./code/data/category-ntp
          echo "full:stun.dus.net" >> ./code/data/category-ntp
          echo "full:stun.schlund.de" >> ./code/data/category-ntp
          echo "full:stun.t-online.de" >> ./code/data/category-ntp
          echo "full:stun.tel.lu" >> ./code/data/category-ntp
          echo "full:stun.uls.co.za" >> ./code/data/category-ntp
          echo "full:stun.vivox.com" >> ./code/data/category-ntp
          echo "full:stun.voip.blackberry.com" >> ./code/data/category-ntp
          echo "full:stun.voipgate.com" >> ./code/data/category-ntp
          echo "full:stun.voys.nl" >> ./code/data/category-ntp
          echo "full:stun.zadarma.com" >> ./code/data/category-ntp
          echo "full:stun.faktortel.com.au" >> ./code/data/category-ntp
          echo "full:stun1.faktortel.com.au" >> ./code/data/category-ntp
          echo "full:ipv4.am.i.mullvad.net" >> ./code/data/category-ntp
          echo "full:ipv6.am.i.mullvad.net" >> ./code/data/category-ntp
          echo "full:stun.nextcloud.com" >> ./code/data/category-ntp
          echo "full:stunserver.stunprotocol.org" >> ./code/data/category-ntp
          echo "full:global.stun.twilio.com" >> ./code/data/category-ntp
          echo "full:jp1.stun.twilio.com" >> ./code/data/category-ntp
          echo "full:sg1.stun.twilio.com" >> ./code/data/category-ntp
          echo "full:us1.stun.twilio.com" >> ./code/data/category-ntp
          echo "full:us2.stun.twilio.com" >> ./code/data/category-ntp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
        shell: bash

      - name: Build dlc.dat and plain lists
        run: |
          cd code || exit 1
          go run ./ --outputdir=../ --exportlists=cn,tld,geolocation,apple,icloud,facebook,tiktok,ai,cdn,stream,download,global,china,reject,reject-drop,reject-no-drop,category-ads-all,category-ai-!cn,category-cdn,category-entertainment,category-social-media,category-scholar,category-pt,category-porn,category-cryptocurrency
          go run ./cmd/datdump/main.go --inputdata=../dlc.dat --outputdir=../ --exportlists=_all_
          cd ../ && rm -rf code

      - name: Copy dlc.dat to geosite.dat
        run: |
          cp -f dlc.dat geosite.dat

      - name: Generate sha256 hash
        run: |
          sha256sum dlc.dat > dlc.dat.sha256sum
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum dlc.dat_plain.yml > dlc.dat_plain.yml.sha256sum

      - name: Generate Zip (dlc.dat + geosite.dat)
        run: |
          zip -9 dlc.dat.zip dlc.dat
          sha256sum dlc.dat.zip > dlc.dat.zip.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum

      - name: Generate XZ (dlc.dat + geosite.dat)
        run: |
          xz -z -9 -k dlc.dat
          sha256sum dlc.dat.xz > dlc.dat.xz.sha256sum
          xz -z -9 -k geosite.dat
          sha256sum geosite.dat.xz > geosite.dat.xz.sha256sum

      - name: Git push assets to "release" branch
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add *.txt *.sha256sum dlc.dat geosite.dat dlc.dat_plain.yml dlc.dat.zip geosite.dat.zip dlc.dat.xz geosite.dat.xz
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} \
            ./dlc.dat ./geosite.dat \
            ./dlc.dat.* ./geosite.dat.* \
            ./dlc.dat_plain.yml ./dlc.dat_plain.yml.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
